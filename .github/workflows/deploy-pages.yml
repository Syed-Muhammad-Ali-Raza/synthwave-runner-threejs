name: Deploy to GitHub Pages

# Deploy only trusted code from the default branch. No pull_request trigger,
# no untrusted refs and no repository secrets are used by this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # Actions are pinned to immutable commit SHAs (with version comments)
      # and credentials are not persisted after checkout.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Check tracked files for committed secrets
        run: |
          if git grep -I -l -E '(-----BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' -- '*.js' '*.html' '*.css' '*.json' '*.yml' '*.yaml'; then
            echo "::error::Possible secret material found in tracked source files"
            exit 1
          fi

      # Publish only the files the browser needs; keep docs, skill files and
      # repository metadata out of the deployed artifact.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp -R index.html css src .nojekyll _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
